name: Public alignment benchmark

on:
  push:
    branches: [main]
    paths:
      - 'public/posts/**'
      - 'public/models/**'
      - 'lib/rephoto/**'
      - '!lib/rephoto/telemetry*.ts'
      - '!lib/rephoto/submit.ts'
      - 'app/api/align/**'
      - 'components/rephoto/rephoto-camera.tsx'
      - 'scripts/rephoto/**'
      - '.github/workflows/public-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The two rejected public pairs are read with git show at a fixed commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: >-
          python -m pip install --only-binary=:all: numpy==2.2.4 Pillow==11.1.0 scipy==1.15.3 opencv-python-headless==4.12.0.88
      - name: Summarize public pairs
        run: python scripts/rephoto/evaluate_outlines.py --public-report >> "$GITHUB_STEP_SUMMARY"
